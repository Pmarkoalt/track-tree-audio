[project]
name = "track-tree-audio"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.156.2",
  "starlette==1.9.0",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "httpx==0.28.1",
  "celery==5.5.3",
  "redis==6.2.0",
  "boto3==1.40.5",
  "requests==2.34.2",
]

[project.optional-dependencies]
gpu = [
    "torch==2.14.1",
    "torchaudio==2.11.0",
    "demucs==4.0.1",
    "numpy==1.26.4",
    "soundfile==0.13.1",
    "torchcodec==0.17.0",
]

cpu = ["torch==2.14.1", "torchaudio==2.11.0", "demucs==4.0.1", "numpy==1.26.4", "soundfile==0.13.1", "torchcodec==0.17.0"]

[dependency-groups]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv]
package = false
conflicts = [[{extra = "cpu"}, {extra = "gpu"}]]

[tool.pytest.ini_options]
testpaths = ["."]
asyncio_mode = "auto"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'"}]
torchaudio = [{index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'"}]
torchcodec = [{index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'"}]
